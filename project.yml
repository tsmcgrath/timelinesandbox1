name: AudioTimeline
options:
  bundleIdPrefix: com.wanderfeast
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true
configFiles:
  Debug: Config/Base.xcconfig
  Release: Config/Base.xcconfig
settings:
  base:
    SWIFT_VERSION: "6.0"
    CODE_SIGN_STYLE: Automatic
targets:
  AudioTimeline:
    type: application
    platform: iOS
    sources:
      - AudioTimeline
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.wanderfeast.AudioTimeline
        PRODUCT_NAME: AudioTimeline
        INFOPLIST_KEY_CFBundleDisplayName: Audio Timeline
        GENERATE_INFOPLIST_FILE: YES
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
  AudioTimelineTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - AudioTimelineTests
    dependencies:
      - target: AudioTimeline
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.wanderfeast.AudioTimelineTests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  AudioTimeline:
    build:
      targets:
        AudioTimeline: all
        AudioTimelineTests: [test]
    test:
      targets:
        - AudioTimelineTests
